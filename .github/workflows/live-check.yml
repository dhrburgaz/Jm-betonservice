name: Controleer live JM Betonservice
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/live-check.yml
      - scripts/check-live.py
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Controleer HTTPS, pagina's, CSS, JavaScript en afbeeldingen
        run: python3 scripts/check-live.py
